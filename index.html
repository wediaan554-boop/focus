<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FOCUS | فوكس - خريطتك لأهدى الأماكن في القصيم</title>
  <meta name="description" content="تطبيق FOCUS (فوكس) هو خريطتك لأهدى الأماكن والمقاهي والمكتبات في بريدة وعنيزة مع أوقات العمل والمنيو وروابط Google Maps المباشرة." />
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#15803d",
            "primary-container": "#14532d",
            "on-primary": "#ffffff",
            "on-primary-container": "#bbf7d0",
            "secondary": "#16a34a",
            "secondary-container": "#dcfce7",
            "on-secondary-container": "#14532d",
            "tertiary": "#166534",
            "tertiary-container": "#22c55e",
            "on-tertiary-container": "#ffffff",
            "background": "#f6f9f6",
            "on-background": "#111813",
            "surface": "#f6f9f6",
            "on-surface": "#111813",
            "surface-variant": "#e2e9e3",
            "on-surface-variant": "#3e4941",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f0f4f1",
            "surface-container": "#eaefe9",
            "surface-container-high": "#e3e9e3",
            "outline": "#6e7971",
            "outline-variant": "#bec9bf",
            "error": "#ba1a1a",
            "error-container": "#ffdad6"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {
            "stack-sm": "4px",
            "base": "8px",
            "gutter": "16px",
            "stack-md": "12px",
            "stack-lg": "24px",
            "container-margin": "20px"
          }
        }
      }
    }
  </script>

  <!-- External & Fallback CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --md-sys-color-primary: #15803d;
      --font-family-arabic: 'Noto Sans Arabic', 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--font-family-arabic);
      background-color: #f6f9f6;
      color: #111813;
      -webkit-tap-highlight-color: transparent;
    }
    html.dark body {
      background-color: #0f1912;
      color: #e1e9e2;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-header {
      background: rgba(246, 249, 246, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    html.dark .glass-header { background: rgba(15, 25, 18, 0.85); }
    .glass-modal {
      background: rgba(15, 25, 18, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .table-available {
      fill: #16a34a; stroke: #ffffff; stroke-width: 2px;
      transition: all 0.25s ease;
      filter: drop-shadow(0px 2px 4px rgba(22, 163, 74, 0.3));
    }
    .table-available:hover { fill: #22c55e; transform: scale(1.05); cursor: pointer; }
    .table-occupied { fill: #dc2626; stroke: #ffffff; stroke-width: 2px; opacity: 0.8; cursor: not-allowed; }
    .pulse-live {
      width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulseLive 1.8s infinite;
    }
    @keyframes pulseLive {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .page-fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0px 8px 24px rgba(21, 128, 61, 0.12); }
  </style>
</head>
<body class="bg-background dark:bg-[#0f1912] text-on-background dark:text-[#e1e9e2] min-h-screen pb-24 selection:bg-primary selection:text-on-primary">

  <!-- Top App Navigation Bar -->
  <header class="sticky top-0 z-40 glass-header px-container-margin py-stack-md flex flex-col gap-stack-md shadow-[0px_4px_20px_rgba(21,128,61,0.05)] border-b border-surface-variant/40 dark:border-outline-variant/20 transition-all">
    <div class="flex justify-between items-center w-full max-w-5xl mx-auto">
      
      <!-- Brand Logo "F" & FOCUS Title -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-600 to-green-800 text-white flex items-center justify-center font-black text-2xl shadow-md tracking-wider border border-emerald-400/30">
          F
        </div>
        <div>
          <div class="flex items-center gap-2 cursor-pointer group hover:opacity-90 transition-opacity" onclick="SukoonApp.openLocationModal()">
            <span class="text-xl font-black text-primary dark:text-emerald-400 tracking-wider">FOCUS</span>
            <span class="text-xs text-outline font-bold truncate max-w-[140px]" id="current-location-label">منطقة القصيم، بريدة</span>
            <span class="material-symbols-outlined text-outline text-sm group-hover:translate-y-0.5 transition-transform">expand_more</span>
          </div>
          <p class="text-[11px] font-bold text-emerald-700 dark:text-emerald-400" id="header-tagline">فوكس هو خريطتك لأهدى الأماكن 🍃</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <!-- Firebase Status -->
        <button onclick="SukoonApp.openFirebaseSettingsModal()" aria-label="Firebase Settings" title="إعدادات Firebase (focus-e933d)" class="h-10 px-3 rounded-full flex items-center gap-1.5 bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-500/20 transition-all border border-emerald-500/30 text-xs font-bold shadow-sm">
          <span class="text-sm">🔥</span>
          <span class="hidden sm:inline" id="firebase-status-label">focus-e933d</span>
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="firebase-status-indicator" title="في انتظار المفاتيح"></span>
        </button>
        <!-- Language Switcher Button -->
        <button onclick="SukoonApp.toggleLanguage()" aria-label="تغيير اللغة" id="lang-toggle-btn" class="h-10 px-3.5 rounded-full flex items-center gap-1.5 bg-surface-container dark:bg-surface-container-high text-on-surface-variant dark:text-on-surface hover:bg-surface-container-high transition-colors shadow-sm text-xs font-bold">
          <span class="text-sm">🌐</span>
          <span id="lang-toggle-text">English</span>
        </button>
        <button onclick="SukoonApp.toggleDarkMode()" aria-label="تغيير المظهر" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container dark:bg-surface-container-high text-on-surface-variant dark:text-on-surface hover:bg-surface-container-high transition-colors shadow-sm">
          <span class="material-symbols-outlined text-lg" id="dark-mode-icon">dark_mode</span>
        </button>
        <button onclick="SukoonApp.openFilterModal()" aria-label="التصفية والفلترة" class="w-10 h-10 rounded-full flex items-center justify-center bg-primary text-on-primary hover:bg-primary-container transition-colors shadow-sm relative">
          <span class="material-symbols-outlined text-lg">tune</span>
        </button>
      </div>

    </div>

    <!-- Active Global Search Input Bar -->
    <div class="w-full max-w-5xl mx-auto flex items-center gap-2 bg-surface-container dark:bg-[#142017] rounded-2xl px-4 py-2.5 shadow-inner border border-surface-variant/50 dark:border-outline-variant/30">
      <span class="material-symbols-outlined text-outline text-lg">search</span>
      <input 
        id="global-search-input"
        type="text" 
        placeholder="ابحث عن مقهى، مكتبة، حي، مخرج كهرباء..." 
        oninput="SukoonApp.handleSearchInput(event)"
        class="bg-transparent border-none outline-none w-full text-xs font-medium placeholder:text-outline/70 dark:placeholder:text-outline text-on-surface dark:text-white"
      />
      <button 
        onclick="SukoonApp.clearSearch()"
        id="search-clear-btn" 
        class="hidden text-outline hover:text-on-surface transition-colors"
      >
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>
  </header>

  <!-- Main Dynamic View -->
  <main id="app-view" class="w-full max-w-5xl mx-auto px-container-margin pt-stack-lg transition-all duration-300">
    <!-- View rendered dynamically -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-surface/95 dark:bg-[#0f1912]/95 backdrop-blur-lg border-t border-surface-variant/40 dark:border-outline-variant/20 px-6 py-2 flex justify-around items-center max-w-5xl mx-auto shadow-lg">
    <button onclick="SukoonApp.switchTab('explore')" class="flex flex-col items-center justify-center px-4 py-1.5 rounded-full transition-all duration-200 text-primary dark:text-emerald-400 font-bold" id="nav-tab-explore">
      <span class="material-symbols-outlined text-xl">explore</span>
      <span class="text-[12px] font-medium mt-0.5" id="nav-label-explore">استكشاف</span>
    </button>
    <button onclick="SukoonApp.switchTab('search')" class="flex flex-col items-center justify-center px-4 py-1.5 rounded-full transition-all duration-200" id="nav-tab-search">
      <span class="material-symbols-outlined text-xl">tune</span>
      <span class="text-[12px] font-medium mt-0.5" id="nav-label-search">التصفية</span>
    </button>
    <button onclick="SukoonApp.switchTab('saved')" class="flex flex-col items-center justify-center px-4 py-1.5 rounded-full transition-all duration-200 relative" id="nav-tab-saved">
      <span class="material-symbols-outlined text-xl">bookmark</span>
      <span class="text-[12px] font-medium mt-0.5" id="nav-label-saved">المحفوظات</span>
      <span class="absolute top-1 right-3 w-4 h-4 bg-secondary text-white text-[10px] rounded-full flex items-center justify-center hidden" id="saved-badge-count">0</span>
    </button>
    <button onclick="SukoonApp.switchTab('profile')" class="flex flex-col items-center justify-center px-4 py-1.5 rounded-full transition-all duration-200" id="nav-tab-profile">
      <span class="material-symbols-outlined text-xl">person</span>
      <span class="text-[12px] font-medium mt-0.5" id="nav-label-profile">حسابي</span>
    </button>
  </nav>

  <!-- Modal Overlay -->
  <div id="modal-container" class="fixed inset-0 z-50 hidden glass-modal flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto page-fade-in">
    <!-- Dynamic Modal Content -->
  </div>

  <!-- Toast System -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-full max-w-sm px-4"></div>

  <!-- Firebase SDKs (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>

  <!-- Modular Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
